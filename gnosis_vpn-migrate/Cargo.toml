serde_json                = { workspace = true }
sha2                      = { workspace = true }
tokio                     = { workspace = true }
tracing                   = { workspace = true }
url                       = { workspace = true }
uzers                     = { workspace = true }
zstd                      = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
