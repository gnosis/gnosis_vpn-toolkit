# Companion binaries for the Gnosis VPN client, one `gnosis_vpn-*` crate each; build/CI scaffolding mirrors gnosis_vpn-client.
[workspace]
members  = ["gnosis_vpn*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "LGPL-3.0"
version = "0.6.0"

# Virtual workspace has no root [package] for crane's pname; outputs pick targets via `--bin`/`--bins`.
[workspace.metadata.crane]
name = "gnosis_vpn-toolkit"

[workspace.dependencies]
anyhow = { version = "~1.0.102" }
backon = { version = "~1.6.0" }
bytesize = { version = "~2.4.0", features = ["serde"] }
chrono = { version = "~0.4.45", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
clap = { version = "~4.6.1", features = ["derive", "env"] }
exitcode = "~1.1.2"
libc = "~0.2.186"
reqwest = { version = "~0.13.4", features = ["json"] }
rustix = { version = "~1.1.5", features = ["fs", "process"] }
serde = { version = "~1.0.228", features = ["derive"] }
serde_json = "~1.0.150"
serde_with = { version = "~3.21.0", features = ["hex"] }
sha2 = "~0.10.8"
tempfile = "~3.27.0"
thiserror = "~2.0.18"
tokio = { version = "~1.53.3", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = { version = "~0.1.44", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "~0.3.23", features = ["env-filter"] }
url = { version = "~2.5.8", features = ["serde"] }
uzers = { version = "~0.12.2", default-features = false }
zstd = "~0.14.3"

# this profile focuses on the best runtime performance and the smallest binary
# size (profiles are honored only at the workspace root)
[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
panic         = "abort"
strip         = true
